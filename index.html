<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Business Card Scanner</title>
    <meta
      name="description"
      content="Upload a business card image, extract details, and save them to Google Sheets."
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f3ee;
        --ink: #202327;
        --muted: #6b706f;
        --line: #d7d0c4;
        --panel: #fffdf8;
        --panel-strong: #fdf7ea;
        --accent: #176b55;
        --accent-hover: #115441;
        --accent-soft: #dff1e8;
        --blue: #315c9f;
        --danger: #aa3e35;
        --shadow: 0 18px 45px rgba(36, 34, 30, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0)),
          var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
      }

      .app-shell {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .topbar {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        padding: 10px 0 24px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2 {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 4.6rem);
        line-height: 0.95;
      }

      h2 {
        font-size: 1.1rem;
      }

      .sheet-link,
      .primary-button,
      .save-button,
      .ghost-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border-radius: 8px;
        font-weight: 800;
        text-decoration: none;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease,
          color 160ms ease;
      }

      .sheet-link,
      .ghost-button {
        border: 1px solid var(--line);
        background: rgba(255, 253, 248, 0.7);
        color: var(--ink);
      }

      .sheet-link:hover,
      .ghost-button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }

      .primary-button,
      .save-button {
        background: var(--accent);
        color: white;
      }

      .primary-button:hover:not(:disabled),
      .save-button:hover:not(:disabled) {
        background: var(--accent-hover);
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 430px;
        gap: 22px;
        align-items: start;
      }

      .scan-panel,
      .details-panel,
      .ocr-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 248, 0.88);
        box-shadow: var(--shadow);
      }

      .scan-panel {
        padding: 16px;
      }

      .dropzone {
        display: grid;
        place-items: center;
        min-height: 220px;
        border: 2px dashed #b9b0a2;
        border-radius: 8px;
        background: var(--panel-strong);
        text-align: center;
        cursor: pointer;
        transition:
          background 160ms ease,
          border-color 160ms ease;
      }

      .dropzone:hover,
      .dropzone.is-dragging {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .dropzone input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      .dropzone strong {
        display: block;
        margin-top: 12px;
        font-size: 1.2rem;
      }

      .dropzone span:last-child {
        display: block;
        max-width: 280px;
        margin-top: 6px;
        color: var(--muted);
        line-height: 1.5;
      }

      .drop-icon {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border-radius: 8px;
        background: white;
        color: var(--accent);
        box-shadow: 0 8px 24px rgba(23, 107, 85, 0.18);
      }

      .drop-icon svg {
        width: 26px;
        height: 26px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .preview-shell {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 260px;
        margin-top: 16px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #eee8dd;
      }

      .preview-shell img {
        display: block;
        width: 100%;
        height: 100%;
        max-height: 420px;
        object-fit: contain;
      }

      .preview-shell.is-empty img {
        display: none;
      }

      .empty-preview {
        color: #81786b;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .preview-shell:not(.is-empty) .empty-preview {
        display: none;
      }

      .action-row {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      .action-row .primary-button {
        flex: 1;
      }

      .progress-wrap {
        margin-top: 16px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
      }

      .progress-copy {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 750;
      }

      .progress-track {
        height: 9px;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: #e8e0d3;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--blue));
        transition: width 180ms ease;
      }

      .details-panel {
        display: grid;
        gap: 14px;
        padding: 18px;
      }

      .panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 4px;
      }

      .quality-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 78px;
        min-height: 30px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .quality-badge.is-good {
        border-color: rgba(23, 107, 85, 0.35);
        background: var(--accent-soft);
        color: var(--accent);
      }

      .quality-badge.is-low {
        border-color: rgba(170, 62, 53, 0.25);
        background: #fae7e4;
        color: var(--danger);
      }

      label {
        display: grid;
        gap: 6px;
      }

      label span {
        color: var(--muted);
        font-size: 0.84rem;
        font-weight: 850;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--ink);
        outline: none;
        padding: 12px 13px;
        transition:
          border-color 140ms ease,
          box-shadow 140ms ease;
      }

      textarea {
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(23, 107, 85, 0.14);
      }

      .save-button {
        width: 100%;
        margin-top: 2px;
      }

      .status-message {
        min-height: 24px;
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
      }

      .status-message.is-error {
        color: var(--danger);
      }

      .status-message.is-success {
        color: var(--accent);
      }

      .ocr-panel {
        margin-top: 22px;
        padding: 18px;
      }

      .compact {
        min-height: 34px;
        padding: 0 12px;
        font-size: 0.88rem;
      }

      pre {
        min-height: 120px;
        max-height: 320px;
        margin: 12px 0 0;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #1f2526;
        color: #eef5ee;
        padding: 14px;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.55;
      }

      @media (max-width: 900px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .details-panel {
          order: 2;
        }
      }

      @media (max-width: 640px) {
        .app-shell {
          width: min(100% - 22px, 1180px);
          padding-top: 18px;
        }

        .topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .sheet-link {
          width: 100%;
        }

        h1 {
          font-size: 2.45rem;
        }

        .dropzone {
          min-height: 190px;
          padding: 18px;
        }

        .action-row {
          flex-direction: column;
        }

        .preview-shell {
          min-height: 210px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="Application header">
        <div>
          <p class="eyebrow">Google Sheets lead capture</p>
          <h1>Business Card Scanner</h1>
        </div>
        <a
          class="sheet-link"
          href="https://docs.google.com/spreadsheets/d/1yiSwzflwi-aKadvH8EllDTGio7s5CLvBRmmZnbLq5kc/edit"
          target="_blank"
          rel="noreferrer"
        >
          Open Sheet
        </a>
      </section>

      <section class="workspace" aria-label="Business card scanner workspace">
        <div class="scan-panel">
          <label id="dropzone" class="dropzone" for="cardFile">
            <input id="cardFile" type="file" accept="image/*" />
            <span class="drop-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M4 17.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-.5" />
                <path d="M12 4v12" />
                <path d="m7 9 5-5 5 5" />
              </svg>
            </span>
            <strong>Upload business card image</strong>
            <span>Drop a PNG, JPG, or WEBP here, or choose a file.</span>
          </label>

          <div id="previewShell" class="preview-shell is-empty">
            <img id="previewImage" alt="Uploaded business card preview" />
            <div id="emptyPreview" class="empty-preview">Card preview</div>
          </div>

          <div class="action-row">
            <button id="scanButton" class="primary-button" type="button" disabled>Scan Card</button>
            <button id="clearButton" class="ghost-button" type="button" disabled>Clear</button>
          </div>

          <div id="progressWrap" class="progress-wrap" hidden>
            <div class="progress-copy">
              <span id="progressLabel">Preparing image</span>
              <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track" aria-hidden="true">
              <div id="progressBar" class="progress-bar"></div>
            </div>
          </div>
        </div>

        <form id="detailsForm" class="details-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Review before saving</p>
              <h2>Extracted Details</h2>
            </div>
            <span id="qualityBadge" class="quality-badge">Waiting</span>
          </div>

          <label>
            <span>Name</span>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Full name" />
          </label>

          <label>
            <span>Number</span>
            <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+91 98765 43210" />
          </label>

          <label>
            <span>Email</span>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com" />
          </label>

          <label>
            <span>Address</span>
            <textarea id="address" name="address" rows="3" placeholder="Street, city, state, postal code"></textarea>
          </label>

          <label>
            <span>Company Name</span>
            <input id="company" name="company" type="text" autocomplete="organization" placeholder="Company Pvt Ltd" />
          </label>

          <button id="saveButton" class="save-button" type="submit">Save to Google Sheet</button>
          <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="ocr-panel" aria-label="OCR text">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">OCR output</p>
            <h2>Detected Text</h2>
          </div>
          <button id="copyTextButton" class="ghost-button compact" type="button" disabled>Copy</button>
        </div>
        <pre id="rawText">Upload a card and scan it to see the detected text.</pre>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
      /*
        Sheet saving options:

        1. Vercel API option:
           Keep SAVE_ENDPOINT as "/api/append" and deploy this HTML together with the api/append.js file
           from the business-card-scanner-vercel folder.

        2. Google Apps Script option:
           Paste your deployed Apps Script web app URL into GOOGLE_APPS_SCRIPT_URL.
           Leave SAVE_ENDPOINT as-is.
      */
      const GOOGLE_APPS_SCRIPT_URL = "";
      const SAVE_ENDPOINT = "/api/append";

      const fileInput = document.querySelector("#cardFile");
      const dropzone = document.querySelector("#dropzone");
      const previewShell = document.querySelector("#previewShell");
      const previewImage = document.querySelector("#previewImage");
      const scanButton = document.querySelector("#scanButton");
      const clearButton = document.querySelector("#clearButton");
      const progressWrap = document.querySelector("#progressWrap");
      const progressLabel = document.querySelector("#progressLabel");
      const progressPercent = document.querySelector("#progressPercent");
      const progressBar = document.querySelector("#progressBar");
      const detailsForm = document.querySelector("#detailsForm");
      const statusMessage = document.querySelector("#statusMessage");
      const rawText = document.querySelector("#rawText");
      const qualityBadge = document.querySelector("#qualityBadge");
      const copyTextButton = document.querySelector("#copyTextButton");

      const fields = {
        name: document.querySelector("#name"),
        phone: document.querySelector("#phone"),
        email: document.querySelector("#email"),
        address: document.querySelector("#address"),
        company: document.querySelector("#company"),
      };

      let selectedFile = null;
      let previewUrl = null;

      const emailPattern = /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i;
      const phonePattern = /(?:\+?\d[\d\s().-]{6,}\d)/g;
      const websitePattern = /\b(?:www\.|https?:\/\/)?[a-z0-9-]+\.[a-z]{2,}(?:\/\S*)?\b/i;
      const companyWords =
        /\b(pvt|private|limited|ltd|llp|llc|inc|corp|corporation|company|co\.|global|group|solutions?|technolog(?:y|ies)|systems?|services?|consulting|industries|enterprise|agency|studio|ventures)\b/i;
      const roleWords =
        /\b(founder|director|manager|officer|executive|sales|marketing|engineer|consultant|designer|developer|lead|head|ceo|cto|cfo|coo|president|partner|associate)\b/i;
      const addressWords =
        /\b(address|road|rd\.|street|st\.|avenue|ave\.|lane|ln\.|floor|suite|unit|sector|block|building|tower|near|city|state|zip|pin|postal|india|usa|uk|delhi|mumbai|noida|gurugram|gurgaon|haryana|uttar|pradesh)\b/i;

      function setStatus(message, type = "") {
        statusMessage.textContent = message;
        statusMessage.classList.toggle("is-error", type === "error");
        statusMessage.classList.toggle("is-success", type === "success");
      }

      function setProgress(label, progress) {
        const value = Math.max(0, Math.min(1, progress || 0));
        progressLabel.textContent = label;
        progressPercent.textContent = `${Math.round(value * 100)}%`;
        progressBar.style.width = `${Math.round(value * 100)}%`;
      }

      function resetProgress() {
        progressWrap.hidden = true;
        setProgress("Preparing image", 0);
      }

      function setQualityBadge(score) {
        qualityBadge.classList.remove("is-good", "is-low");

        if (!score) {
          qualityBadge.textContent = "Waiting";
          return;
        }

        if (score >= 4) {
          qualityBadge.textContent = "Strong";
          qualityBadge.classList.add("is-good");
          return;
        }

        qualityBadge.textContent = "Review";
        qualityBadge.classList.add("is-low");
      }

      function cleanLine(line) {
        return line
          .replace(/[|{}[\]<>]/g, " ")
          .replace(/\s+/g, " ")
          .replace(/^[^\w+@#]+|[^\w.)@+-]+$/g, "")
          .trim();
      }

      function normalizeText(text) {
        return text
          .replace(/[“”]/g, '"')
          .replace(/[‘’]/g, "'")
          .replace(/\u00a0/g, " ")
          .replace(/[^\S\r\n]+/g, " ")
          .trim();
      }

      function unique(items) {
        return [...new Set(items.filter(Boolean))];
      }

      function countDigits(value) {
        return (value.match(/\d/g) || []).length;
      }

      function titleCaseFromDomain(email) {
        const match = String(email || "").match(/@([^.\s@]+)/);
        if (!match) return "";

        return match[1]
          .split(/[-_]/)
          .filter(Boolean)
          .map((part) => part.charAt(0).toUpperCase() + part.slice(1).toLowerCase())
          .join(" ");
      }

      function isNoise(line) {
        if (!line || line.length < 2) return true;
        if (/^[.\-_,:;]+$/.test(line)) return true;
        if (/^(tel|mob|mobile|phone|email|e-mail|web|website|www)$/i.test(line)) return true;
        return false;
      }

      function isContactLine(line) {
        return emailPattern.test(line) || phonePattern.test(line) || websitePattern.test(line);
      }

      function isAddressLine(line) {
        if (emailPattern.test(line) || websitePattern.test(line)) return false;
        if (addressWords.test(line)) return true;
        if (/\b\d{5,6}\b/.test(line) && /[, ]/.test(line)) return true;
        if (/^\d{1,5}\s+[A-Za-z]/.test(line)) return true;
        return false;
      }

      function isPersonName(line) {
        if (isContactLine(line) || isAddressLine(line) || companyWords.test(line) || roleWords.test(line)) {
          return false;
        }

        if (/\d/.test(line) || line.length > 42) return false;

        const words = line
          .replace(/[.,]/g, " ")
          .split(/\s+/)
          .filter(Boolean);

        if (words.length < 2 || words.length > 4) return false;

        return words.every((word) => {
          if (word.length === 1) return /^[A-Z]$/i.test(word);
          return /^[A-Z][a-z'.-]+$/.test(word) || /^[A-Z]{2,}$/.test(word);
        });
      }

      function findPhone(lines) {
        const candidates = [];

        for (const line of lines) {
          const matches = line.match(phonePattern) || [];
          for (const match of matches) {
            const digits = countDigits(match);
            if (digits >= 7 && digits <= 15) {
              candidates.push(match.replace(/\s+/g, " ").trim());
            }
          }
        }

        return unique(candidates).sort((a, b) => countDigits(b) - countDigits(a))[0] || "";
      }

      function findCompany(lines, email) {
        const explicit = lines.find((line) => companyWords.test(line) && !isContactLine(line));
        if (explicit) return explicit;

        const topLine = lines.slice(0, 4).find((line) => {
          if (isContactLine(line) || isAddressLine(line) || roleWords.test(line) || isPersonName(line)) return false;
          return /[A-Za-z]{3,}/.test(line) && line.length <= 45;
        });

        return topLine || titleCaseFromDomain(email);
      }

      function findName(lines, company) {
        const companyLower = String(company || "").toLowerCase();
        const personLine = lines.find((line) => {
          if (companyLower && line.toLowerCase() === companyLower) return false;
          return isPersonName(line);
        });

        if (personLine) return personLine;

        return (
          lines.find((line) => {
            if (isContactLine(line) || isAddressLine(line) || companyWords.test(line) || roleWords.test(line)) return false;
            if (companyLower && line.toLowerCase() === companyLower) return false;
            return /^[A-Za-z][A-Za-z\s'.-]{2,40}$/.test(line);
          }) || ""
        );
      }

      function findAddress(lines, usedValues) {
        const used = usedValues.map((value) => String(value || "").toLowerCase()).filter(Boolean);
        const addressLines = lines.filter((line) => {
          const lower = line.toLowerCase();
          if (used.includes(lower)) return false;
          return isAddressLine(line);
        });

        return unique(addressLines).join(", ");
      }

      function parseBusinessCard(text) {
        const normalized = normalizeText(text);
        const lines = normalized
          .split(/\r?\n/)
          .map(cleanLine)
          .filter((line) => !isNoise(line));

        const email = lines.map((line) => line.match(emailPattern)?.[0]).find(Boolean) || "";
        const phone = findPhone(lines);
        const company = findCompany(lines, email);
        const name = findName(lines, company);
        const address = findAddress(lines, [name, phone, email, company]);

        return { name, phone, email, address, company, lines };
      }

      function scoreDetails(details) {
        return ["name", "phone", "email", "address", "company"].reduce((score, key) => {
          return score + (details[key] ? 1 : 0);
        }, 0);
      }

      function fillForm(details) {
        fields.name.value = details.name || "";
        fields.phone.value = details.phone || "";
        fields.email.value = details.email || "";
        fields.address.value = details.address || "";
        fields.company.value = details.company || "";
        setQualityBadge(scoreDetails(details));
      }

      function selectFile(file) {
        if (!file || !file.type.startsWith("image/")) {
          setStatus("Please upload an image file.", "error");
          return;
        }

        selectedFile = file;
        if (previewUrl) URL.revokeObjectURL(previewUrl);

        previewUrl = URL.createObjectURL(file);
        previewImage.src = previewUrl;
        previewShell.classList.remove("is-empty");
        scanButton.disabled = false;
        clearButton.disabled = false;
        setStatus("Image ready. Scan it to extract the details.");
        resetProgress();
      }

      async function prepareImage(file) {
        const bitmap = await createImageBitmap(file);
        const maxSide = 1800;
        const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));

        const context = canvas.getContext("2d", { willReadFrequently: true });
        context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);

        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;

        for (let index = 0; index < data.length; index += 4) {
          const gray = data[index] * 0.299 + data[index + 1] * 0.587 + data[index + 2] * 0.114;
          const contrasted = Math.max(0, Math.min(255, (gray - 128) * 1.22 + 128));
          data[index] = contrasted;
          data[index + 1] = contrasted;
          data[index + 2] = contrasted;
        }

        context.putImageData(imageData, 0, 0);

        return new Promise((resolve) => {
          canvas.toBlob((blob) => resolve(blob || file), "image/png", 0.96);
        });
      }

      async function scanCard() {
        if (!selectedFile) return;
        if (!window.Tesseract) {
          setStatus("OCR library did not load. Check your internet connection and refresh.", "error");
          return;
        }

        scanButton.disabled = true;
        progressWrap.hidden = false;
        setProgress("Preparing image", 0.04);
        setStatus("Scanning card. This can take a few seconds on the first run.");

        try {
          const preparedImage = await prepareImage(selectedFile);
          const result = await Tesseract.recognize(preparedImage, "eng", {
            logger(message) {
              if (message.status === "recognizing text") {
                setProgress("Reading text", message.progress || 0);
              } else if (message.status) {
                setProgress(message.status.replace(/^\w/, (char) => char.toUpperCase()), message.progress || 0.08);
              }
            },
          });

          const detectedText = normalizeText(result.data.text || "");
          rawText.textContent = detectedText || "No readable text was detected.";
          copyTextButton.disabled = !detectedText;

          const details = parseBusinessCard(detectedText);
          fillForm(details);
          setProgress("Scan complete", 1);

          if (scoreDetails(details) >= 4) {
            setStatus("Details extracted. Review them, then save to Google Sheet.", "success");
          } else {
            setStatus("Some details need review. Edit the fields before saving.", "error");
          }
        } catch (error) {
          setStatus(error.message || "Could not scan this image.", "error");
          setQualityBadge(0);
        } finally {
          scanButton.disabled = false;
        }
      }

      function getFormDetails() {
        return {
          name: fields.name.value.trim(),
          phone: fields.phone.value.trim(),
          email: fields.email.value.trim(),
          address: fields.address.value.trim(),
          company: fields.company.value.trim(),
        };
      }

      async function saveDetails(event) {
        event.preventDefault();

        const details = getFormDetails();
        const hasAnyValue = Object.values(details).some(Boolean);

        if (!hasAnyValue) {
          setStatus("Add at least one detail before saving.", "error");
          return;
        }

        const saveButton = document.querySelector("#saveButton");
        const endpoint = GOOGLE_APPS_SCRIPT_URL || SAVE_ENDPOINT;
        saveButton.disabled = true;
        setStatus("Saving to Google Sheet...");

        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(details),
          });

          const text = await response.text();
          let payload = {};
          try {
            payload = text ? JSON.parse(text) : {};
          } catch (_error) {
            payload = { ok: response.ok, raw: text };
          }

          if (!response.ok || payload.error) {
            throw new Error(payload.error || "Could not save to Google Sheet.");
          }

          setStatus("Saved to Google Sheet.", "success");
        } catch (error) {
          setStatus(error.message || "Could not save to Google Sheet.", "error");
        } finally {
          saveButton.disabled = false;
        }
      }

      function clearAll() {
        selectedFile = null;
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = null;
        fileInput.value = "";
        previewImage.removeAttribute("src");
        previewShell.classList.add("is-empty");
        scanButton.disabled = true;
        clearButton.disabled = true;
        copyTextButton.disabled = true;
        detailsForm.reset();
        rawText.textContent = "Upload a card and scan it to see the detected text.";
        setStatus("");
        setQualityBadge(0);
        resetProgress();
      }

      fileInput.addEventListener("change", (event) => {
        selectFile(event.target.files?.[0]);
      });

      dropzone.addEventListener("dragover", (event) => {
        event.preventDefault();
        dropzone.classList.add("is-dragging");
      });

      dropzone.addEventListener("dragleave", () => {
        dropzone.classList.remove("is-dragging");
      });

      dropzone.addEventListener("drop", (event) => {
        event.preventDefault();
        dropzone.classList.remove("is-dragging");
        selectFile(event.dataTransfer.files?.[0]);
      });

      scanButton.addEventListener("click", scanCard);
      clearButton.addEventListener("click", clearAll);
      detailsForm.addEventListener("submit", saveDetails);

      copyTextButton.addEventListener("click", async () => {
        await navigator.clipboard.writeText(rawText.textContent);
        setStatus("OCR text copied.", "success");
      });
    </script>
  </body>
</html>
