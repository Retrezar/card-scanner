<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Business Card Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f3ee;
      color: #202327;
      padding: 24px;
    }
    .wrap { max-width: 1100px; margin: auto; }
    h1 { font-size: 44px; margin: 0 0 20px; }
    .grid { display: grid; grid-template-columns: 1fr 420px; gap: 20px; }
    .panel {
      background: #fffdf8;
      border: 1px solid #d8d0c4;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
    }
    .drop {
      border: 2px dashed #b8afa1;
      border-radius: 10px;
      min-height: 180px;
      display: grid;
      place-items: center;
      text-align: center;
      cursor: pointer;
      background: #fdf7ea;
      padding: 20px;
    }
    .drop.drag { border-color: #176b55; background: #dff1e8; }
    .drop input { display: none; }
    .preview {
      margin-top: 16px;
      min-height: 240px;
      border: 1px solid #d8d0c4;
      border-radius: 10px;
      background: #eee8dd;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .preview img {
      max-width: 100%;
      max-height: 400px;
      display: none;
    }
    .row { display: flex; gap: 10px; margin-top: 14px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .primary { background: #176b55; color: white; flex: 1; }
    .ghost { background: white; border: 1px solid #d8d0c4; }
    label { display: block; margin-bottom: 12px; font-weight: 700; color: #68706f; }
    input, textarea {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      border: 1px solid #d8d0c4;
      border-radius: 8px;
      font: inherit;
    }
    textarea { resize: vertical; }
    .status { min-height: 24px; color: #68706f; }
    .ok { color: #176b55; }
    .err { color: #a33b32; }
    .progress { margin-top: 14px; display: none; }
    .bar-bg { height: 9px; background: #e8e0d3; border-radius: 99px; overflow: hidden; }
    .bar { width: 0%; height: 100%; background: #176b55; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #1f2526;
      color: #eef5ee;
      padding: 14px;
      border-radius: 8px;
      max-height: 280px;
      overflow: auto;
    }
    @media (max-width: 850px) {
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 34px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Business Card Scanner</h1>

    <div class="grid">
      <div class="panel">
        <label id="drop" class="drop">
          <input id="file" type="file" accept="image/*" />
          <div>
            <strong>Upload business card image</strong><br />
            <small>PNG, JPG, or WEBP</small>
          </div>
        </label>

        <div class="preview">
          <img id="previewImg" alt="Business card preview" />
          <span id="previewText">Card preview</span>
        </div>

        <div class="row">
          <button id="scanBtn" class="primary" type="button" disabled>Scan Card</button>
          <button id="clearBtn" class="ghost" type="button" disabled>Clear</button>
        </div>

        <div id="progress" class="progress">
          <p id="progressText">Preparing...</p>
          <div class="bar-bg"><div id="bar" class="bar"></div></div>
        </div>
      </div>

      <form id="form" class="panel">
        <h2>Extracted Details</h2>

        <label>Name
          <input id="name" name="name" type="text" placeholder="Full name" />
        </label>

        <label>Number
          <input id="phone" name="phone" type="tel" placeholder="+91 98765 43210" />
        </label>

        <label>Email
          <input id="email" name="email" type="email" placeholder="name@company.com" />
        </label>

        <label>Address
          <textarea id="address" name="address" rows="3" placeholder="Address"></textarea>
        </label>

        <label>Company Name
          <input id="company" name="company" type="text" placeholder="Company name" />
        </label>

        <button id="saveBtn" class="primary" type="submit">Save to Google Sheet</button>
        <p id="status" class="status"></p>
      </form>
    </div>

    <div class="panel" style="margin-top:20px;">
      <h2>Detected Text</h2>
      <pre id="rawText">Upload and scan a card to see OCR text.</pre>
    </div>
  </div>

  <script>
    const GOOGLE_APPS_SCRIPT_URL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    const $ = (id) => document.getElementById(id);

    const fileInput = $("file");
    const drop = $("drop");
    const previewImg = $("previewImg");
    const previewText = $("previewText");
    const scanBtn = $("scanBtn");
    const clearBtn = $("clearBtn");
    const form = $("form");
    const statusEl = $("status");
    const rawText = $("rawText");
    const progress = $("progress");
    const progressText = $("progressText");
    const bar = $("bar");

    let selectedFile = null;
    let previewUrl = null;

    const fields = {
      name: $("name"),
      phone: $("phone"),
      email: $("email"),
      address: $("address"),
      company: $("company")
    };

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = "status " + type;
    }

    function setProgress(label, value) {
      progress.style.display = "block";
      progressText.textContent = label;
      bar.style.width = Math.round(Math.max(0, Math.min(1, value)) * 100) + "%";
    }

    function selectFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        setStatus("Please upload an image file.", "err");
        return;
      }

      selectedFile = file;
      if (previewUrl) URL.revokeObjectURL(previewUrl);

      previewUrl = URL.createObjectURL(file);
      previewImg.src = previewUrl;
      previewImg.style.display = "block";
      previewText.style.display = "none";
      scanBtn.disabled = false;
      clearBtn.disabled = false;
      setStatus("Image ready. Click Scan Card.");
    }

    function cleanLine(line) {
      return line
        .replace(/[|{}[\]<>]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function parseCard(text) {
      const lines = text
        .split(/\r?\n/)
        .map(cleanLine)
        .filter(Boolean);

      const email = (text.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i) || [""])[0];

      const phoneMatches = text.match(/(?:\+?\d[\d\s().-]{6,}\d)/g) || [];
      const phone = phoneMatches
        .map((p) => p.trim())
        .filter((p) => (p.match(/\d/g) || []).length >= 7)
        .sort((a, b) => (b.match(/\d/g) || []).length - (a.match(/\d/g) || []).length)[0] || "";

      const companyWords = /\b(pvt|private|limited|ltd|llp|llc|inc|corp|company|global|group|solutions|technology|technologies|services|consulting|industries|enterprise|agency|studio)\b/i;
      const roleWords = /\b(founder|director|manager|officer|executive|sales|marketing|engineer|consultant|designer|developer|lead|head|ceo|cto|cfo|coo|partner)\b/i;
      const addressWords = /\b(address|road|street|floor|suite|sector|block|building|tower|city|state|pin|postal|india|delhi|mumbai|noida|gurugram|haryana)\b/i;

      let company = lines.find((line) => companyWords.test(line) && !line.includes("@")) || "";
      if (!company && email) {
        const domain = email.split("@")[1]?.split(".")[0] || "";
        company = domain ? domain.charAt(0).toUpperCase() + domain.slice(1) : "";
      }

      let name = lines.find((line) => {
        if (line.includes("@") || /\d/.test(line) || companyWords.test(line) || roleWords.test(line) || addressWords.test(line)) return false;
        const words = line.split(/\s+/);
        return words.length >= 2 && words.length <= 4 && line.length <= 42;
      }) || "";

      let address = lines
        .filter((line) => {
          if (line === name || line === company || line.includes("@") || line === phone) return false;
          return addressWords.test(line) || /\b\d{5,6}\b/.test(line);
        })
        .join(", ");

      return { name, phone, email, address, company };
    }

    async function prepareImage(file) {
      const bitmap = await createImageBitmap(file);
      const maxSide = 1800;
      const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));

      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);

      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        const contrast = Math.max(0, Math.min(255, (gray - 128) * 1.22 + 128));
        data[i] = contrast;
        data[i + 1] = contrast;
        data[i + 2] = contrast;
      }

      ctx.putImageData(imageData, 0, 0);

      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob || file), "image/png", 0.96);
      });
    }

    async function scanCard() {
      if (!selectedFile) return;

      scanBtn.disabled = true;
      setStatus("Scanning card...");

      try {
        const image = await prepareImage(selectedFile);

        const result = await Tesseract.recognize(image, "eng", {
          logger(message) {
            if (message.status) setProgress(message.status, message.progress || 0.05);
          }
        });

        const text = (result.data.text || "").trim();
        rawText.textContent = text || "No readable text detected.";

        const details = parseCard(text);
        fields.name.value = details.name;
        fields.phone.value = details.phone;
        fields.email.value = details.email;
        fields.address.value = details.address;
        fields.company.value = details.company;

        setProgress("Scan complete", 1);
        setStatus("Details extracted. Review and save.", "ok");
      } catch (error) {
        setStatus(error.message || "Could not scan image.", "err");
      } finally {
        scanBtn.disabled = false;
      }
    }

    function getDetails() {
      return {
        name: fields.name.value.trim(),
        phone: fields.phone.value.trim(),
        email: fields.email.value.trim(),
        address: fields.address.value.trim(),
        company: fields.company.value.trim()
      };
    }

    function submitToAppsScript(details) {
      return new Promise((resolve) => {
        const iframeName = "sheetFrame_" + Date.now();

        const iframe = document.createElement("iframe");
        iframe.name = iframeName;
        iframe.style.display = "none";

        const postForm = document.createElement("form");
        postForm.method = "POST";
        postForm.action = GOOGLE_APPS_SCRIPT_URL.trim();
        postForm.target = iframeName;
        postForm.style.display = "none";

        const payload = document.createElement("input");
        payload.type = "hidden";
        payload.name = "payload";
        payload.value = JSON.stringify(details);

        postForm.appendChild(payload);
        document.body.appendChild(iframe);
        document.body.appendChild(postForm);

        iframe.addEventListener("load", () => {
          setTimeout(() => {
            postForm.remove();
            iframe.remove();
          }, 300);
          resolve();
        });

        postForm.submit();

        setTimeout(resolve, 2500);
      });
    }

    async function saveDetails(event) {
      event.preventDefault();

      const details = getDetails();

      if (!Object.values(details).some(Boolean)) {
        setStatus("Add at least one detail before saving.", "err");
        return;
      }

      if (!GOOGLE_APPS_SCRIPT_URL.trim() || GOOGLE_APPS_SCRIPT_URL.includes("PASTE_")) {
        setStatus("Paste your Google Apps Script Web App URL inside GOOGLE_APPS_SCRIPT_URL first.", "err");
        return;
      }

      $("saveBtn").disabled = true;
      setStatus("Saving to Google Sheet...");

      try {
        await submitToAppsScript(details);
        setStatus("Sent to Google Sheet. Open the sheet and check the new row.", "ok");
      } catch (error) {
        setStatus(error.message || "Could not save to Google Sheet.", "err");
      } finally {
        $("saveBtn").disabled = false;
      }
    }

    function clearAll() {
      selectedFile = null;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = null;

      fileInput.value = "";
      previewImg.removeAttribute("src");
      previewImg.style.display = "none";
      previewText.style.display = "block";

      scanBtn.disabled = true;
      clearBtn.disabled = true;
      progress.style.display = "none";
      bar.style.width = "0%";
      form.reset();
      rawText.textContent = "Upload and scan a card to see OCR text.";
      setStatus("");
    }

    fileInput.addEventListener("change", (event) => selectFile(event.target.files[0]));

    drop.addEventListener("dragover", (event) => {
      event.preventDefault();
      drop.classList.add("drag");
    });

    drop.addEventListener("dragleave", () => drop.classList.remove("drag"));

    drop.addEventListener("drop", (event) => {
      event.preventDefault();
      drop.classList.remove("drag");
      selectFile(event.dataTransfer.files[0]);
    });

    scanBtn.addEventListener("click", scanCard);
    clearBtn.addEventListener("click", clearAll);
    form.addEventListener("submit", saveDetails);
  </script>
</body>
</html>
