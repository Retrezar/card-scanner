<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Business Card Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #f5f3ee;
      --ink: #202327;
      --muted: #68706f;
      --panel: #fffdf8;
      --soft: #fdf7ea;
      --line: #d8d0c4;
      --accent: #176b55;
      --accent2: #315c9f;
      --danger: #a33b32;
      --shadow: 0 18px 45px rgba(36, 34, 30, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,0)), var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, textarea { font: inherit; }
    button { border: 0; }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    .top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1, h2 { margin: 0; letter-spacing: 0; }
    h1 { font-size: clamp(2rem, 5vw, 4.5rem); line-height: .95; }
    h2 { font-size: 1.1rem; }

    .sheet-link,
    .button,
    .ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: 850;
      text-decoration: none;
      transition: background .16s ease, color .16s ease, border-color .16s ease, transform .16s ease;
    }

    .sheet-link, .ghost {
      border: 1px solid var(--line);
      background: rgba(255,253,248,.72);
      color: var(--ink);
    }

    .sheet-link:hover, .ghost:hover:not(:disabled) {
      color: var(--accent);
      border-color: var(--accent);
    }

    .button {
      background: var(--accent);
      color: white;
    }

    .button:hover:not(:disabled) {
      background: #115441;
      transform: translateY(-1px);
    }

    button:disabled { cursor: not-allowed; opacity: .45; }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 430px;
      gap: 22px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,253,248,.9);
      box-shadow: var(--shadow);
    }

    .left { padding: 16px; }

    .dropzone {
      display: grid;
      place-items: center;
      min-height: 220px;
      border: 2px dashed #b8afa1;
      border-radius: 8px;
      background: var(--soft);
      text-align: center;
      cursor: pointer;
    }

    .dropzone:hover, .dropzone.dragging {
      border-color: var(--accent);
      background: #dff1e8;
    }

    .dropzone input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .drop-icon {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 8px;
      background: #fff;
      color: var(--accent);
      box-shadow: 0 8px 24px rgba(23,107,85,.18);
    }

    .drop-icon svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .dropzone strong {
      display: block;
      margin-top: 12px;
      font-size: 1.2rem;
    }

    .dropzone small {
      display: block;
      max-width: 280px;
      margin-top: 7px;
      color: var(--muted);
      line-height: 1.5;
    }

    .preview {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 260px;
      margin-top: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #eee8dd;
    }

    .preview img {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 420px;
      object-fit: contain;
    }

    .preview.empty img { display: none; }
    .preview:not(.empty) .empty-text { display: none; }

    .empty-text {
      color: #82796c;
      font-weight: 850;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .actions .button { flex: 1; }

    .progress {
      margin-top: 16px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 800;
    }

    .track {
      height: 9px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8e0d3;
    }

    .bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .18s ease;
    }

    form.panel {
      display: grid;
      gap: 14px;
      padding: 18px;
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 4px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 78px;
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 850;
    }

    .badge.good {
      border-color: rgba(23,107,85,.35);
      background: #dff1e8;
      color: var(--accent);
    }

    .badge.low {
      border-color: rgba(163,59,50,.28);
      background: #fae7e4;
      color: var(--danger);
    }

    label {
      display: grid;
      gap: 6px;
    }

    label span {
      color: var(--muted);
      font-size: .84rem;
      font-weight: 850;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      outline: none;
      padding: 12px 13px;
    }

    textarea { resize: vertical; }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23,107,85,.14);
    }

    .save { width: 100%; margin-top: 2px; }

    .status {
      min-height: 24px;
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .status.ok { color: var(--accent); }
    .status.err { color: var(--danger); }

    .ocr {
      margin-top: 22px;
      padding: 18px;
    }

    .compact {
      min-height: 34px;
      padding: 0 12px;
      font-size: .88rem;
    }

    pre {
      min-height: 120px;
      max-height: 320px;
      margin: 12px 0 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1f2526;
      color: #eef5ee;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      form.panel { order: 2; }
    }

    @media (max-width: 640px) {
      .app { width: min(100% - 22px, 1180px); padding-top: 18px; }
      .top { align-items: stretch; flex-direction: column; }
      .sheet-link { width: 100%; }
      h1 { font-size: 2.45rem; }
      .dropzone { min-height: 190px; padding: 18px; }
      .actions { flex-direction: column; }
      .preview { min-height: 210px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="top" aria-label="Application header">
      <div>
        <p class="eyebrow">Google Sheets lead capture</p>
        <h1>Business Card Scanner</h1>
      </div>
      <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1yiSwzflwi-aKadvH8EllDTGio7s5CLvBRmmZnbLq5kc/edit" target="_blank" rel="noreferrer">Open Sheet</a>
    </section>

    <section class="grid" aria-label="Business card scanner workspace">
      <div class="panel left">
        <label id="dropzone" class="dropzone" for="fileInput">
          <input id="fileInput" type="file" accept="image/*" />
          <span class="drop-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M4 17.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-.5" />
              <path d="M12 4v12" />
              <path d="m7 9 5-5 5 5" />
            </svg>
          </span>
          <strong>Upload business card image</strong>
          <small>Drop a PNG, JPG, or WEBP here, or choose a file.</small>
        </label>

        <div id="preview" class="preview empty">
          <img id="previewImage" alt="Uploaded business card preview" />
          <div class="empty-text">Card preview</div>
        </div>

        <div class="actions">
          <button id="scanButton" class="button" type="button" disabled>Scan Card</button>
          <button id="clearButton" class="ghost" type="button" disabled>Clear</button>
        </div>

        <div id="progress" class="progress" hidden>
          <div class="progress-top">
            <span id="progressLabel">Preparing image</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="track" aria-hidden="true"><div id="progressBar" class="bar"></div></div>
        </div>
      </div>

      <form id="detailsForm" class="panel">
        <div class="heading">
          <div>
            <p class="eyebrow">Review before saving</p>
            <h2>Extracted Details</h2>
          </div>
          <span id="badge" class="badge">Waiting</span>
        </div>

        <label><span>Name</span><input id="name" name="name" type="text" autocomplete="name" placeholder="Full name" /></label>
        <label><span>Number</span><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+91 98765 43210" /></label>
        <label><span>Email</span><input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com" /></label>
        <label><span>Address</span><textarea id="address" name="address" rows="3" placeholder="Street, city, state, postal code"></textarea></label>
        <label><span>Company Name</span><input id="company" name="company" type="text" autocomplete="organization" placeholder="Company Pvt Ltd" /></label>

        <button id="saveButton" class="button save" type="submit">Save to Google Sheet</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel ocr" aria-label="OCR text">
      <div class="heading">
        <div>
          <p class="eyebrow">OCR output</p>
          <h2>Detected Text</h2>
        </div>
        <button id="copyButton" class="ghost compact" type="button" disabled>Copy</button>
      </div>
      <pre id="rawText">Upload a card and scan it to see the detected text.</pre>
    </section>
  </main>

  <script>
    /*
      Paste your Google Apps Script Web App URL below.
      A single HTML file cannot safely contain Google service-account keys.

      Apps Script code to paste in Extensions > Apps Script:

      const SHEET_ID = "1yiSwzflwi-aKadvH8EllDTGio7s5CLvBRmmZnbLq5kc";
      const SHEET_NAME = "Sheet1";

      function doPost(e) {
        const data = JSON.parse((e && e.postData && e.postData.contents) || "{}");
        const sheet = SpreadsheetApp.openById(SHEET_ID).getSheetByName(SHEET_NAME);
        sheet.appendRow([data.name || "", data.phone || "", data.email || "", data.address || "", data.company || ""]);
        return ContentService.createTextOutput(JSON.stringify({ ok: true })).setMimeType(ContentService.MimeType.JSON);
      }
    */
    const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygovi3bafQDV0_anUuC1x7mUDpk6swYbhAC5lu2M8oSiIDXVhBNUoaoJIDY73kjdNo/exec";

    const $ = (selector) => document.querySelector(selector);
    const fileInput = $("#fileInput");
    const dropzone = $("#dropzone");
    const preview = $("#preview");
    const previewImage = $("#previewImage");
    const scanButton = $("#scanButton");
    const clearButton = $("#clearButton");
    const progress = $("#progress");
    const progressLabel = $("#progressLabel");
    const progressPercent = $("#progressPercent");
    const progressBar = $("#progressBar");
    const detailsForm = $("#detailsForm");
    const statusLine = $("#status");
    const rawText = $("#rawText");
    const badge = $("#badge");
    const copyButton = $("#copyButton");
    const fields = {
      name: $("#name"),
      phone: $("#phone"),
      email: $("#email"),
      address: $("#address"),
      company: $("#company")
    };

    let selectedFile = null;
    let previewUrl = null;

    const emailPattern = /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i;
    const phonePattern = /(?:\+?\d[\d\s().-]{6,}\d)/g;
    const websitePattern = /\b(?:www\.|https?:\/\/)?[a-z0-9-]+\.[a-z]{2,}(?:\/\S*)?\b/i;
    const companyWords = /\b(pvt|private|limited|ltd|llp|llc|inc|corp|corporation|company|co\.|global|group|solutions?|technolog(?:y|ies)|systems?|services?|consulting|industries|enterprise|agency|studio|ventures)\b/i;
    const roleWords = /\b(founder|director|manager|officer|executive|sales|marketing|engineer|consultant|designer|developer|lead|head|ceo|cto|cfo|coo|president|partner|associate)\b/i;
    const addressWords = /\b(address|road|rd\.|street|st\.|avenue|ave\.|lane|ln\.|floor|suite|unit|sector|block|building|tower|near|city|state|zip|pin|postal|india|usa|uk|delhi|mumbai|noida|gurugram|gurgaon|haryana|uttar|pradesh)\b/i;

    function setStatus(message, type = "") {
      statusLine.textContent = message;
      statusLine.classList.toggle("ok", type === "ok");
      statusLine.classList.toggle("err", type === "err");
    }

    function setProgress(label, amount) {
      const value = Math.max(0, Math.min(1, amount || 0));
      progressLabel.textContent = label;
      progressPercent.textContent = `${Math.round(value * 100)}%`;
      progressBar.style.width = `${Math.round(value * 100)}%`;
    }

    function setBadge(score) {
      badge.classList.remove("good", "low");
      if (!score) {
        badge.textContent = "Waiting";
      } else if (score >= 4) {
        badge.textContent = "Strong";
        badge.classList.add("good");
      } else {
        badge.textContent = "Review";
        badge.classList.add("low");
      }
    }

    function cleanLine(line) {
      return line
        .replace(/[|{}[\]<>]/g, " ")
        .replace(/\s+/g, " ")
        .replace(/^[^\w+@#]+|[^\w.)@+-]+$/g, "")
        .trim();
    }

    function normalizeText(text) {
      return text
        .replace(/[“”]/g, '"')
        .replace(/[‘’]/g, "'")
        .replace(/\u00a0/g, " ")
        .replace(/[^\S\r\n]+/g, " ")
        .trim();
    }

    function unique(items) {
      return [...new Set(items.filter(Boolean))];
    }

    function digits(value) {
      return (value.match(/\d/g) || []).length;
    }

    function titleCaseFromDomain(email) {
      const match = String(email || "").match(/@([^.\s@]+)/);
      if (!match) return "";
      return match[1].split(/[-_]/).filter(Boolean).map((part) => part.charAt(0).toUpperCase() + part.slice(1).toLowerCase()).join(" ");
    }

    function isNoise(line) {
      if (!line || line.length < 2) return true;
      if (/^[.\-_,:;]+$/.test(line)) return true;
      return /^(tel|mob|mobile|phone|email|e-mail|web|website|www)$/i.test(line);
    }

    function isContactLine(line) {
      return emailPattern.test(line) || phonePattern.test(line) || websitePattern.test(line);
    }

    function isAddressLine(line) {
      if (emailPattern.test(line) || websitePattern.test(line)) return false;
      if (addressWords.test(line)) return true;
      if (/\b\d{5,6}\b/.test(line) && /[, ]/.test(line)) return true;
      return /^\d{1,5}\s+[A-Za-z]/.test(line);
    }

    function isPersonName(line) {
      if (isContactLine(line) || isAddressLine(line) || companyWords.test(line) || roleWords.test(line)) return false;
      if (/\d/.test(line) || line.length > 42) return false;
      const words = line.replace(/[.,]/g, " ").split(/\s+/).filter(Boolean);
      if (words.length < 2 || words.length > 4) return false;
      return words.every((word) => {
        if (word.length === 1) return /^[A-Z]$/i.test(word);
        return /^[A-Z][a-z'.-]+$/.test(word) || /^[A-Z]{2,}$/.test(word);
      });
    }

    function findPhone(lines) {
      const candidates = [];
      for (const line of lines) {
        const matches = line.match(phonePattern) || [];
        for (const match of matches) {
          const count = digits(match);
          if (count >= 7 && count <= 15) candidates.push(match.replace(/\s+/g, " ").trim());
        }
      }
      return unique(candidates).sort((a, b) => digits(b) - digits(a))[0] || "";
    }

    function findCompany(lines, email) {
      const explicit = lines.find((line) => companyWords.test(line) && !isContactLine(line));
      if (explicit) return explicit;
      const topLine = lines.slice(0, 4).find((line) => {
        if (isContactLine(line) || isAddressLine(line) || roleWords.test(line) || isPersonName(line)) return false;
        return /[A-Za-z]{3,}/.test(line) && line.length <= 45;
      });
      return topLine || titleCaseFromDomain(email);
    }

    function findName(lines, company) {
      const companyLower = String(company || "").toLowerCase();
      const personLine = lines.find((line) => {
        if (companyLower && line.toLowerCase() === companyLower) return false;
        return isPersonName(line);
      });
      if (personLine) return personLine;
      return lines.find((line) => {
        if (isContactLine(line) || isAddressLine(line) || companyWords.test(line) || roleWords.test(line)) return false;
        if (companyLower && line.toLowerCase() === companyLower) return false;
        return /^[A-Za-z][A-Za-z\s'.-]{2,40}$/.test(line);
      }) || "";
    }

    function findAddress(lines, usedValues) {
      const used = usedValues.map((value) => String(value || "").toLowerCase()).filter(Boolean);
      return unique(lines.filter((line) => !used.includes(line.toLowerCase()) && isAddressLine(line))).join(", ");
    }

    function parseBusinessCard(text) {
      const lines = normalizeText(text).split(/\r?\n/).map(cleanLine).filter((line) => !isNoise(line));
      const email = lines.map((line) => line.match(emailPattern)?.[0]).find(Boolean) || "";
      const phone = findPhone(lines);
      const company = findCompany(lines, email);
      const name = findName(lines, company);
      const address = findAddress(lines, [name, phone, email, company]);
      return { name, phone, email, address, company };
    }

    function score(details) {
      return ["name", "phone", "email", "address", "company"].reduce((sum, key) => sum + (details[key] ? 1 : 0), 0);
    }

    function fillForm(details) {
      fields.name.value = details.name || "";
      fields.phone.value = details.phone || "";
      fields.email.value = details.email || "";
      fields.address.value = details.address || "";
      fields.company.value = details.company || "";
      setBadge(score(details));
    }

    function selectFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        setStatus("Please upload an image file.", "err");
        return;
      }
      selectedFile = file;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);
      previewImage.src = previewUrl;
      preview.classList.remove("empty");
      scanButton.disabled = false;
      clearButton.disabled = false;
      progress.hidden = true;
      setProgress("Preparing image", 0);
      setStatus("Image ready. Scan it to extract the details.");
    }

    async function prepareImage(file) {
      const bitmap = await createImageBitmap(file);
      const maxSide = 1800;
      const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      for (let index = 0; index < data.length; index += 4) {
        const gray = data[index] * .299 + data[index + 1] * .587 + data[index + 2] * .114;
        const contrasted = Math.max(0, Math.min(255, (gray - 128) * 1.22 + 128));
        data[index] = contrasted;
        data[index + 1] = contrasted;
        data[index + 2] = contrasted;
      }
      context.putImageData(imageData, 0, 0);
      return new Promise((resolve) => canvas.toBlob((blob) => resolve(blob || file), "image/png", .96));
    }

    async function scanCard() {
      if (!selectedFile) return;
      if (!window.Tesseract) {
        setStatus("OCR library did not load. Please check internet and refresh.", "err");
        return;
      }
      scanButton.disabled = true;
      progress.hidden = false;
      setProgress("Preparing image", .04);
      setStatus("Scanning card. This can take a few seconds.");
      try {
        const image = await prepareImage(selectedFile);
        const result = await Tesseract.recognize(image, "eng", {
          logger(message) {
            if (message.status === "recognizing text") {
              setProgress("Reading text", message.progress || 0);
            } else if (message.status) {
              setProgress(message.status.replace(/^\w/, (char) => char.toUpperCase()), message.progress || .08);
            }
          }
        });
        const detected = normalizeText(result.data.text || "");
        rawText.textContent = detected || "No readable text was detected.";
        copyButton.disabled = !detected;
        const details = parseBusinessCard(detected);
        fillForm(details);
        setProgress("Scan complete", 1);
        setStatus(score(details) >= 4 ? "Details extracted. Review them, then save to Google Sheet." : "Some details need review. Edit the fields before saving.", score(details) >= 4 ? "ok" : "err");
      } catch (error) {
        setStatus(error.message || "Could not scan this image.", "err");
        setBadge(0);
      } finally {
        scanButton.disabled = false;
      }
    }

    function getDetails() {
      return {
        name: fields.name.value.trim(),
        phone: fields.phone.value.trim(),
        email: fields.email.value.trim(),
        address: fields.address.value.trim(),
        company: fields.company.value.trim()
      };
    }

    async function saveDetails(event) {
      event.preventDefault();
      const details = getDetails();
      if (!Object.values(details).some(Boolean)) {
        setStatus("Add at least one detail before saving.", "err");
        return;
      }
      if (!GOOGLE_APPS_SCRIPT_URL.trim()) {
        setStatus("Paste your Google Apps Script Web App URL into GOOGLE_APPS_SCRIPT_URL inside this HTML file first.", "err");
        return;
      }
      const saveButton = $("#saveButton");
      saveButton.disabled = true;
      setStatus("Saving to Google Sheet...");
      try {
        await fetch(GOOGLE_APPS_SCRIPT_URL.trim(), {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(details)
        });
        setStatus("Sent to Google Sheet. Open the sheet to confirm the new row.", "ok");
      } catch (error) {
        setStatus(error.message || "Could not save to Google Sheet.", "err");
      } finally {
        saveButton.disabled = false;
      }
    }

    function clearAll() {
      selectedFile = null;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = null;
      fileInput.value = "";
      previewImage.removeAttribute("src");
      preview.classList.add("empty");
      scanButton.disabled = true;
      clearButton.disabled = true;
      copyButton.disabled = true;
      detailsForm.reset();
      rawText.textContent = "Upload a card and scan it to see the detected text.";
      setStatus("");
      setBadge(0);
      progress.hidden = true;
      setProgress("Preparing image", 0);
    }

    fileInput.addEventListener("change", (event) => selectFile(event.target.files?.[0]));
    dropzone.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropzone.classList.add("dragging");
    });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragging"));
    dropzone.addEventListener("drop", (event) => {
      event.preventDefault();
      dropzone.classList.remove("dragging");
      selectFile(event.dataTransfer.files?.[0]);
    });
    scanButton.addEventListener("click", scanCard);
    clearButton.addEventListener("click", clearAll);
    detailsForm.addEventListener("submit", saveDetails);
    copyButton.addEventListener("click", async () => {
      await navigator.clipboard.writeText(rawText.textContent);
      setStatus("OCR text copied.", "ok");
    });
  </script>
</body>
</html>
